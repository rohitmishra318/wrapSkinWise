name: SkinWise CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - working-directory: ./backend
      run: npm ci
    - working-directory: ./backend
      run: npm run lint
    - working-directory: ./backend
      run: npm audit --audit-level=high || true # Warn on audit issues for now

  backend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - working-directory: ./backend
      run: npm ci
    - working-directory: ./backend
      run: npm test

  python-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - run: pip install ruff pip-audit
    - run: ruff check python_service/ sr_service/
    - run: pip-audit -r python_service/requirements.txt -r sr_service/requirements.txt || true # Warn on audit issues

  python-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - working-directory: ./python_service
      run: |
        pip install -r requirements.txt
        pip install pytest
        pytest tests/

  docker-build:
    needs: [backend-lint, backend-test, python-lint, python-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Build and push Backend
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: ghcr.io/${{ github.repository }}/skinwise-backend:${{ github.sha }},ghcr.io/${{ github.repository }}/skinwise-backend:latest
        
    - name: Build and push Python Service
      uses: docker/build-push-action@v5
      with:
        context: ./python_service
        push: true
        tags: ghcr.io/${{ github.repository }}/skinwise-python:${{ github.sha }},ghcr.io/${{ github.repository }}/skinwise-python:latest
        
    - name: Build and push SR Service
      uses: docker/build-push-action@v5
      with:
        context: ./sr_service
        push: true
        tags: ghcr.io/${{ github.repository }}/skinwise-sr:${{ github.sha }},ghcr.io/${{ github.repository }}/skinwise-sr:latest
