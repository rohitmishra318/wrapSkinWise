global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'backend'
    static_configs:
      - targets: ['host.docker.internal:5000']
        
  - job_name: 'python_service'
    static_configs:
      - targets: ['host.docker.internal:7000']
        
  - job_name: 'sr_service'
    static_configs:
      - targets: ['host.docker.internal:7001']
