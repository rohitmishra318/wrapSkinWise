version: "3.9"

services:
  nginx:
    image: nginx:alpine
    container_name: skinwise-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - skinwise_network

  backend:
    build: ./backend
    container_name: skinwise-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - mongodb
      - redis
    networks:
      - skinwise_network

  frontend:
    build: ./frontend
    container_name: skinwise-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - skinwise_network

  python_service:
    build: ./python_service
    container_name: skinwise-python
    restart: unless-stopped
    ports:
      - "7000:7000"
    networks:
      - skinwise_network

  sr_service:
    build: ./sr_service
    container_name: skinwise-sr
    restart: unless-stopped
    ports:
      - "7001:7001"
    networks:
      - skinwise_network

  mongodb:
    image: mongo:7
    container_name: skinwise-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - skinwise_network

  redis:
    image: redis:7
    container_name: skinwise-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - skinwise_network

networks:
  skinwise_network:

volumes:
  mongo_data:
  redis_data:
