version: "3.9"

services:
  mongo:
    image: mongo:6
    container_name: skinwise-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: skinwise-backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
      - python_service

  python_service:
    build: ./python_service
    container_name: skinwise-python
    restart: always
    ports:
      - "7000:7000"

  frontend:
    build: ./frontend
    container_name: skinwise-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo_data:
